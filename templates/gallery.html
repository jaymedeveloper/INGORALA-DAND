<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ગેલેરી - ઈંગોરાળા</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial;background:#f0f2f5;padding:16px;}
        .container{max-width:600px;margin:auto;background:white;border-radius:24px;overflow:hidden;}
        .header{background:#1e6f2f;color:white;padding:18px;text-align:center;position:relative;}
        .back-btn{position:absolute;left:16px;top:18px;color:white;text-decoration:none;background:rgba(0,0,0,0.2);padding:6px 14px;border-radius:25px;}
        .filter-bar{padding:16px;display:flex;flex-wrap:wrap;gap:8px;background:#f8f9fa;}
        .filter-btn{padding:6px 14px;background:#e9ecef;border-radius:25px;text-decoration:none;color:#333;font-size:13px;}
        .filter-btn.active{background:#1e6f2f;color:white;}
        .gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;}
        .image-card{background:#f8f9fa;border-radius:12px;overflow:hidden;text-align:center;}
        .image-card img{width:100%;height:140px;object-fit:cover;}
        .image-card p{padding:10px;font-size:13px;font-weight:500;color:#1e6f2f;}
        .footer{background:#1a472a;color:white;text-align:center;padding:14px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">←</a>
            <h2>🖼️ ઈંગોરાળાની યાદો</h2>
        </div>
        
        <div class="filter-bar">
            <a href="/gallery" class="filter-btn {% if not request.args.get('category') %}active{% endif %}">બધા</a>
            {% for cat in categories %}
            <a href="/gallery?category={{ cat }}" class="filter-btn">{{ cat }}</a>
            {% endfor %}
        </div>
        
        <div class="gallery-grid">
            {% for img in images %}
            <div class="image-card">
                <img src="{{ img.image_url }}" alt="{{ img.title }}">
                <p>{{ img.title }}</p>
            </div>
            {% else %}
            <div style="grid-column:1/-1;text-align:center;padding:40px;">❌ હજુ કોઈ ફોટા નથી</div>
            {% endfor %}
        </div>
        
        <div class="footer">
            📸 અમારા ગામની સુંદરતા
        </div>
    </div>
</body>
</html>
